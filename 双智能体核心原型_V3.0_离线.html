ils>`}
function assistant(c){const r=M.contractReport(c.id),examples=M.contractExamples(c.id),checks=!c.deposit?[{key:'deposit-check',pending:true,title:'保证金保障资料待核验',fact:'未取得完整应缴条款与有效余额，暂无法判断保障是否充足。',analysis:'本项为资料核验事项，尚未认定保证金不足，不计入已识别履约风险。',advice:`由${c.owner}在2个工作日内请财务核对生效保证金条款、到账、抵扣及退还记录，形成应缴与有效余额对账表；确认缺口后联系客户补缴并登记期限，核验完成后刷新本合同分析。`,source:'AI参考建议 · 保证金资料未取得',action:'contractsource',label:'查看保证金依据'}]:[];
return `<div class="assistant-header"><div><h2>合同助手</h2> ${tag('当前合同 · 自动分析')}<p>具体问题逐项列出，建议随分析结果直接生成；点击问题查看详情。</p></div><div class="analysis-toolbar"><span>上次分析 ${e(analysisTime())}</span>${btn('重新分析','refresh','','small')}<small>源数据读取 ${M.ASOF} · 测试系统快照</small></div></div>`+kpis([{label:'租金应收',value:c.ar,unit:'元',note:'全周期已生成租金账单，含未到期'},{label:'租金已收',value:c.paid,unit:'元',note:'按同一批账单实收汇总'},{label:'逾期未缴',value:c.overdue,unit:'元',tone:c.overdue?'red':'',note:'应收日早于截至日的待缴余额'},{label:'未到期待缴',value:c.notDue,unit:'元',note:'未到期应收尚待缴纳的余额'}])+reconciliation(c)+`<div class="overview-grid report-layout">`+card('履约五维雷达',radar(c),btn('查看维度口径','dimensions','','link small'))+`<section class="card report-card"><div class="card-head"><h3>履约分析与行动建议</h3>${btn('查看全部依据','contractsource','','link small')}</div><div class="report-summary"><b>${examples.filter(x=>!x.pending).length} 项履约建议示例 · ${examples.filter(x=>x.pending).length+checks.length} 项资料核验</b><p>租金逾期未缴 ${M.money(c.overdue)}；距合同到期 ${c.days} 天。催缴、企业风险、合同变更与保证金分别跟进；点击问题展开查看分析及最终建议。</p></div><div class="report-scroll issue-list">${[...examples,...checks].map((b,i)=>issueCard(b,i,c)).join('')||'<div class="empty">当前没有待处理问题。</div>'}</div><p class="caption report-footer">源数据读取 ${M.ASOF} · ${btn('生成跟进待办草稿','task','','link small')}</p></section></div>`+(S.reply?card('维度分析结果',contractReply(c,S.reply)):'')+draftNotice(c)}
function issuePolicy(key){const c=M.contract(S.contract),issue=M.contractReport(c.id).issues.find(x=>x.key===key);if(!issue)return;const ad=M.collectionAdvice(c);drawer('项目规则核对 · '+M.scopes[c.project],fields([['合同',c.id],['具体问题',issue.title],['规则状态',ad.configured?'已取得适用规则':'当前快照未取得项目规则配置'],['处理方式',ad.configured?'依据生效规则生成建议事项':'使用AI参考建议，正式接入后须再次查询项目配置']])+`<p class="helper">规则检查顺序：当前项目 → 具体问题类型 → 生效版本 → 适用阶段。若取得规则，引用规则ID和版本；确认项目无规则时才使用AI建议。当前快照未包含规则接口，不推断项目实际有无规则。</p>`,btn('生成建议事项','issue-generate',key,'primary'))}
function draftNotice(c){const n=S.drafts.filter(x=>x.contract===c.id).length;return n?`<div class="draft-list">本次演示已保存 ${n} 份本地草稿。${btn('查看草稿','draftlist','','link small')} · 草稿保存不改变合同账单状态。</div>`:''}
function contractAnalysis(c,q){let title='履约核查结果',text='',action='contractsource';
if(/所有|整体|哪些合同|多少合同|各项目/.test(q))return{title:'请前往智能问数查看整体数据',text:'当前助手仅分析 '+c.id+'。全域合同、资产、客商、账单的统计与对比可进入驾驶舱下的智能问数。',action:'gotoask'};
if(/企业|主体|经营风险/.test(q)){const b=M.contractReport(c.id).blocks.find(b=>b.key==='enterprise');title=b.title;text=b.fact+' '+b.analysis+' 建议：'+b.advice;action='enterprise';}
else if(/变更|稳定/.test(q)){const b=M.contractReport(c.id).blocks.find(b=>b.key==='stability');title=b.title;text=b.fact+' '+b.analysis+' 建议：'+b.advice;action='changes';}
else if(/保证金/.test(q)){title='保证金核验';text=c.deposit?`有效保证金 ${M.money(c.deposit[0])}，应缴 ${M.money(c.deposit[1])}，缺口 ${M.money(Math.max(0,c.deposit[1]-c.deposit[0]))}。保证金与租金分别核算。`:'当前未取得保证金应缴和有效余额数据，无法判断是否交齐。建议财务补充保证金条款、到账、抵扣和退还记录。';}
else if(/到期|续签/.test(q)){title='到期与续签准备';text=`合同于 ${c.end} 结束，距 ${M.ASOF} 尚有 ${c.days} 天。`+(c.renew?`已进入90天准备窗口，准备清单完成 ${c.renew[0]} / ${c.renew[1]} 项。建议确认续签意向、审批方案并跟踪协议签署。准备完成率不代表续签概率。`:'尚未进入90天准备窗口，可按现有履约计划继续跟踪。');action='renew';}
else if(/已经|已付|到账|付过|分配/.test(q)){title='到账与核销差异核对';text=`当前账单待缴 ${M.money(c.balance)}。`+(c.unallocated?`另有收款 RC-A01-01，2026-11-07到账 ${M.money(c.unallocated)}，已关联当前合同，尚未分配至账单。因此当前仍显示原逾期 ${M.money(c.overdue)}。请财务核对后完成正式分配，再重新分析。`:'当前未取得已确认关联本合同的待分配到账。请核对付款凭证、收款流水和核销记录。');action='billlist';}
else if(/及时|历史|迟付/.test(q)){title='付款及时性';text=c.timely===null?'未取得付款实际到账日，无法判断按期付款率及历史迟付情况。请接入收款日期与账单关联记录后分析。':`到期应收 ${M.money(c.ar)}，按期核销 ${M.money(c.timely)}，按期回款完成率 ${M.pct(c.timely,c.ar)}%。租金已收中有 ${M.money(c.latePaid)} 属于历史迟付，已结清部分不会重复计入当前欠费。当前逾期余额 ${M.money(c.overdue)}。`;action='billlist';}
else if(/催缴|催收|下一步|风险|处理|跟进/.test(q)){title='处理建议与催缴准备';text=c.overdue?`当前合同逾期未缴 ${M.money(c.overdue)}。${c.unallocated?'请优先核对 '+M.money(c.unallocated)+' 已到账待分配款项；':''}建议由 ${c.owner} 复核账单与收款，再生成催缴草稿并确认发送方式。${c.renew?'同时跟踪 '+c.end+' 到期前的续签准备。':''}实际收款和任务完成需回到原业务流程确认。`:'当前无逾期余额，无需针对当前账单生成逾期催缴。可继续关注后续付款节点与到期安排。';action=c.overdue?'draft':'contractsource';}
else if(/账单|交费|缴费|欠|应收|回款|付款|未交|没交/.test(q)){title='当前账单与未缴核查';text=`当前期间应收 ${M.money(c.ar)}，租金已收 ${M.money(c.paid)}，待缴 ${M.money(c.balance)}，其中逾期 ${M.money(c.overdue)}。${c.bills.filter(b=>b.balance>0).map(b=>b.id+' 待缴 '+M.money(b.balance)+'，到期日 '+b.due+'。').join('')}${c.unallocated?'另有 '+M.money(c.unallocated)+' 到账待分配，暂不冲减账单余额。':''}`;action='billlist';}
else{title='请补充要核查的履约问题';text='可询问当前合同的账单未缴、催缴、到账差异、保证金、付款及时性或续签准备。此原型按预设业务场景演示，真实语言理解由企业中台承担。'}
return{title,text,action};}
function contractReply(c,q){const a=contractAnalysis(c,q),labels={billlist:'查看账单与收款',draft:'生成催缴草稿',renew:'查看续签清单',contractsource:'查看数据依据',gotoask:'进入智能问数',enterprise:'查看企业信息',changes:'查看变更记录'};return `<div class="contract-answer" id="contract-reply"><div class="answer-meta"><span class="ai-badge">AI</span>当前合同 ${c.id} · 来源分析</div><h4>${e(a.title)}</h4><p>${e(a.text)}</p><div class="row">${btn(labels[a.action],a.action,'','link small')}${btn('生成跟进待办草稿','task','','link small')}</div></div>`}
function question(cq){S.reply=cq;render();$('#contract-reply')?.scrollIntoView({behavior:'smooth',block:'center'})}
function queryChips(){return `<div class="query-chips"><span>试着问</span>${[['经营收缴概览','目前合同履约和租金收缴情况怎么样？'],['客户欠租','哪些客户还欠租金？'],['项目收缴','各项目租金收缴情况怎么样？'],['客户合同','北京城华房地产开发有限公司签了几份合同，还欠多少租金？'],['到期续租','最近90天有哪些合同要到期，续租该怎么跟进？'],['年底待收','年底前还有多少租金要收回来？'],].map(([t,q])=>btn(t,'ask',q,'question-chip')).join('')}</div>`}
function queryPage(){const active=S.sessions.find(x=>x.id===S.active);return `<div class="breadcrumb">经营驾驶舱 / 智能问数</div><div class="title-row"><div><h1>智能问数</h1><p>直接说出关注的项目和指标，查看经营数据及分析解读。</p></div>${btn('新建会话','new','','primary small')}</div><div class="query-context"><span>按当前账号权限查询 · 在问题中指定项目可进一步缩小范围</span><span>数据截至 ${M.ASOF} · 测试系统快照</span></div><div class="query-layout"><section class="conversation"><div class="conversation-top"><h3>${active?e(active.title):'开始一次经营分析'}</h3>${tag(S.busy?'正在生成…':'AI 问数')}</div><div class="chat-log" id="chat-log">${active?active.messages.map((m,i)=>message(m,i)).join(''):welcome()}</div>${queryChips()}<form class="composer" id="ask-form"><div class="input-frame"><textarea id="question" aria-label="智能问数问题" placeholder="例如：海开园配套商业还有哪些合同欠费？按合同列出来。" ${S.busy?'disabled':''}></textarea><div class="input-bottom"><span>Enter 发送 · Shift + Enter 换行</span>${S.busy?btn('停止生成','stop','','small'):'<button class="primary" type="submit">发送</button>'}</div></div><p class="composer-note">结果含统计范围、数据时点和来源。无权限、无匹配记录、数据不足分别展示；当前仅载入4家客户、5份合同。</p></form></section><aside class="history-panel"><div class="row between"><h3>历史会话</h3><span class="small muted">${S.sessions.length} 条</span></div><p>选择会话，回看当时的数据与分析</p>${[['异常返回示例',S.sessions.filter(x=>['demo-denied','demo-empty','demo-missing'].includes(x.id))],['业务查询记录',S.sessions.filter(x=>!['demo-denied','demo-empty','demo-missing'].includes(x.id))]].map(([label,list])=>`<div class="history-label">${label}</div>${list.map(x=>`<button class="history-item ${x.id===S.active?'selected':''}" data-action="history" data-value="${e(x.id)}"><b>${e(x.title)}</b>${x.messages[0]?.q!==x.title?`<small>${e(x.messages[0]?.q||x.title)}</small>`:''}<small>${e(x.time)} · ${e(M.scopes[x.scope])} · ${x.messages.length}轮</small></button>`).join('')}`).join('')}<div class="history-footer">范围：资产、客商、合同、账单与收款。<br>历史保留原查询快照；需要最新数据时重新生成。</div></aside></div><div class="demo-bar"><span>左侧查询数据 + 分析解读 · 右侧历史回看</span>${btn('查看问数落地场景（'+SCENES.filter(x=>x.agent==='ask').length+'）','scenes','ask','link small')}</div>`}
function welcome(){return `<div class="welcome compact-welcome"><p class="eyebrow">BUSINESS INSIGHTS</p><h2>从经营问题，找到具体行动</h2><p>可询问经营、合同、款项、资产规模；指定项目无需另选筛选器。<br>右侧已准备完整问答，支持查看有数据、无数据与无权限的展示。</p></div>`}
function message(m,i){return `<article><div class="user-message"><div>${e(m.q)}</div></div><div class="answer-message"><div class="answer-meta"><span class="ai-badge">AI</span> 智能问数 <span class="muted">${M.scopes[m.a.scope]}</span></div><div class="answer-body" id="stream-${i}">${e(m.shown||'')}${m.status==='streaming'?'<span class="stream-line"></span>':''}</div>${m.status==='streaming'?'<p class="progress-text">已读取授权数据，正在组织结果…</p>':m.status==='stopped'?`<p class="progress-text">已停止生成，当前内容未完成。</p>${btn('重新生成','retry',i,'link small')}`:resultCard(m.a,i)}</div></article>`}
function resultCard(a,i){return `<div class="answer-result"><div class="result-section-label">${a.rows.length?'01 · 查询数据':'查询状态'}</div><h3>${e(a.title)}</h3>${a.metrics.length?kpis(a.metrics):''}${a.chart.length?chart(a):''}${a.rows.length?table(a.columns,a.rows.map(r=>r.values.map((v,j)=>j===0&&r.id?btn(v,'opencontract',r.id,'link small'):e(v)))):''}${a.insights?.length?`<section class="insight-section"><h4>02 · 分析解读</h4>${a.insights.map(t=>`<p>${e(t)}</p>`).join('')}</section>`:''}<div class="answer-actions">${a.evidence.length?btn('查看数据来源与口径','sources',i,'link small'):`<span class="small muted">${a.kind==='denied'?'未查询目标项目数据':a.kind==='empty'?'查询成功，未发现匹配记录':'当前问题需要补充数据或范围'}</span>`}<div class="row">${btn('重新生成','retry',i,'link small')}${a.rows.length?btn('导出结果 CSV','export',i,'link small'):''}</div></div><p class="result-stamp">截至 ${a.asof} · ${e(M.scopes[a.scope])} · 查询快照</p></div><div class="followups">${a.followups.map(q=>btn(q,'ask',q,'small')).join('')}</div>`}
function chart(a){const max=Math.max(...a.chart.map(x=>x.value??0),1);return `<div class="bar-chart"><p class="bar-title">${e(a.chartTitle)}</p>${a.chart.map(x=>`<div class="bar-row"><span>${e(x.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,x.value??0)/max*100}%"></div></div><span class="bar-value">${x.value===null?'—':x.value.toLocaleString('zh-CN')}</span></div>`).join('')}</div>`}
function scrollChat(){const el=$('#chat-log');if(el)el.scrollTop=el.scrollHeight}
function activeSession(){return S.sessions.find(x=>x.id===S.active)}
function stop(show=true){if(S.timer){clearInterval(S.timer);S.timer=null}if(S.busy){const m=activeSession()?.messages.at(-1);if(m)m.status='stopped';S.busy=false;save();if(show)render()}}
function newSession(){stop(false);S.active=null;render();$('#question')?.focus()}
function ask(q){q=q.trim();if(!q||S.busy)return;let session=activeSession();if(!session){session={id:'s'+Date.now(),title:q.slice(0,60),scope:S.scope,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:[]};S.sessions.unshift(session);S.sessions=S.sessions.slice(0,30);S.active=session.id}const prev=session.messages.at(-1)?.a;const a=M.answer(q,session.scope,prev);const m={q,a,shown:'',status:'streaming'};session.messages.push(m);S.busy=true;if($('#question'))$('#question').value='';render();let n=0;S.timer=setInterval(()=>{n+=8;m.shown=a.text.slice(0,n);const el=$('#stream-'+(session.messages.length-1));if(el){el.textContent=m.shown;const c=document.createElement('span');c.className='stream-line';el.appendChild(c);scrollChat()}if(n>=a.text.length){clearInterval(S.timer);S.timer=null;m.status='done';S.busy=false;save();render()}},26)}
function drawer(title,body,foot=''){const prev=document.activeElement;S.previousFocus=prev;$('#overlay').innerHTML=`<div class="overlay-screen"><section class="drawer" role="dialog" aria-modal="true" aria-label="${e(title)}"><header class="drawer-head"><div><h2>${e(title)}</h2><p>海开资管 · 双智能体原型</p></div>${btn('关闭','close','','small')}</header><div class="drawer-body">${body}</div>${foot?`<footer class="drawer-foot">${foot}</footer>`:''}</section></div>`;$('#overlay [data-action="close"]').focus()}
function close(){const f=S.previousFocus;$('#overlay').innerHTML='';if(f?.isConnected)f.focus()}
function dimensions(){const c=M.contract(S.contract);drawer('履约雷达 · 维度口径',`<p class="helper">五轴独立展示，指标值须有来源。不合成信用评级。企业风险与合同变更来源缺失时显示—，不填0。</p>${M.radar(c.id).map(a=>`<div class="scene-card"><h3>${e(a.label)} ${tag(a.value===null?'—':a.value+(a.unit||'%'))}</h3><p>${e(a.fact)}</p><p class="caption">${e(a.formula)}</p>${btn('查看维度分析','cq',a.question,'link small')}</div>`).join('')}`)}
function enterprise(){const c=M.contract(S.contract),ep=M.enterpriseProfiles[c.customer];drawer('企业经营与风险依据 · '+c.name,fields([['签约主体',c.name],['匹配标识','客商主数据 '+c.customer+'（演示映射）'],['来源',ep?.source||'未取得'],['数据更新',ep?.updated||'未取得']])+ (ep?`<div class="note">企业风险按已授权来源核验，1级最低、5级最高；有效事件取最高风险等级，等级不换算分值。</div>`+fields([['登记状态',ep.status],['经营异常',ep.abnormal+'项'],['司法风险',ep.judicial+'项'],['风险等级',M.enterpriseRiskLevel(ep)===null?'待核验':M.enterpriseRiskLevel(ep)+'级（1级最低，5级最高）']])+`<h3>事件依据</h3><div class="source-list">${(ep.refs||[]).map(t=>`<div>${e(t)}</div>`).join('')}</div><p class="helper">外部信号用于辅助核验，不等同于该合同违约。第三方详情链接需由真实接口提供，本原型不伪造来源链接。</p>`:'<div class="note">企业信息未取得，当前无法判断经营风险。请补齐主体映射与已授权数据来源后分析。</div>'))}

function flow(){return `<h3>系统级履约与客商统一分析（V3.8）</h3><div class="flow-list"><div>01 · AI工作台 → 合同履约助手<small>按资管账号权限获取全部可见合同，按项目缩小分析范围。</small></div><div>02 · 核心指标 → 场景现状 → 问题与建议<small>费用回款、临期结算、同一客商多合同、企业风险与舆情、合同变更；明细按需展开。</small></div><div>03 · 下钻客商详情 → 客商助手<small>回款情况、合同变更、企业风险、舆情监控、租赁规模五维分析；租赁规模按当前履约中合同面积汇总。</small></div><div>04 · 下钻单合同 → 核对具体账单与规则 → 人工处理<small>共享同一批事实与指标；更新分析不伪造外部数据刷新或业务操作。</small></div></div><h3>合同助手：在合同详情完成单份合同核查</h3><div class="flow-list"><div>01 · 合同台账 → 合同详情 → 合同助手 Tab<small>携带当前合同ID；进入即展示当前数据范围。</small></div><div>02 · 资管取数、校验并计算<small>复用单合同业务API，补充企业信息、合同变更、保证金与项目催缴规则；按需封装为受控工具/MCP。</small></div><div>03 · 企业中台分析并返回<small>资管后端通过 BaseURL + API 调用合同助手，返回结论、维度指标、建议和证据。</small></div><div>04 · 资管展示 → 核对明细 → 人工处理 → 重新分析<small>雷达、账单、准备清单和草稿；正式收款、发出催缴、派单、续签均由已有业务流程处理。</small></div></div><h3>智能问数：驾驶舱下的连续对话</h3><div class="flow-list"><div>01 · 驾驶舱 → 智能问数 → 直接提出业务问题<small>覆盖用户有权访问的资产、客商、合同、账单等业务数据。</small></div><div>02 · 企业中台识别问题 → 资管数据接口执行查询<small>业务数据同步到AI专用视图/中间表或数据仓库，统一指标口径；中台仅查询已授权的数据层，不直接面对业务全表。</small></div><div>03 · 结果流式返回 → 左侧展示<small>状态、文字增量、指标、图表、表格、证据依次呈现；可停止和重新生成。</small></div><div>04 · 继续追问 / 合同下钻 / 右侧历史回看<small>按会话保留上下文与结果快照。历史不自动刷新，重新查询生成新快照。</small></div></div><h3>双方系统怎么连接</h3><p>资管页面 → 资管后端 → 企业AI中台（BaseURL + API）→ 资管后端校验结果 → 页面展示。合同助手复用业务API与受控工具；智能问数依托AI专用视图/中间表或数据仓库，先治理再查询。中台通过双方约定的受控业务API查询授权数据；合同助手优先由资管后端提供单合同事实快照。</p><div class="note">BaseURL、鉴权密钥、智能体应用ID和接口路径在服务端配置。中台真实协议尚需双方联调确认，详细方案提供的是拟定适配协议。</div><p class="helper">当前页面为可操作的前端原型：测试系统只读快照、本地草稿和历史、模拟流式展示。真实中台与业务API尚未接入。</p>`}

if(a==='workspace-rules'){drawer('欠租与保证金保障口径',fields([['欠租','当前合同已到期未缴租金余额'],['保障','财务确认的有效保证金，考虑抵扣与退还'],['触发','欠租>0 且 欠租≥有效保证金'],['来源不足','显示待核验；不把余额缺失填为0'],['后续','按生效条款及项目规则发起补充保障、清缴或终止处置评估']])+`<p class="helper">保证金与租金单列。欠款达到保证金时不自动终止或扣款，实际处置执行原业务审批流程。</p>`);return}
if(a==='workspace-task'){const scope=S.page==='customer'?AM.customer(S.customer,S.customerScope):AM.portfolio(S.portfolioScope),cs=scope.rows||scope.contracts,text=`【本地跟进清单草稿，未派单】\n数据截至：${M.ASOF}\n范围：${S.page==='customer'?scope.name:M.scopes[S.portfolioScope]}\n`+cs.map((c,i)=>`${i+1}. ${c.id} / ${c.name}：欠租${M.money(c.overdue)}，${c.expiring?'距到期'+c.days+'天；':''}请合同经办与财务核账，按项目规则安排收缴；保证金及外部信用待核验。`).join('\n');drawer('履约跟进清单 · 本地草稿',`<textarea id="workspace-draft" aria-label="跟进清单草稿">${e(text)}</textarea><p class="caption">可编辑复制；没有创建任务、发送通知或修改合同。</p>`,btn('复制清单','workspace-copy','','primary small'));return}
if(a==='workspace-copy'){const text=$('#workspace-draft')?.value||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>notify('已复制本地清单，未派单')).catch(()=>notify('请手动选择内容复制'));else notify('请手动选择内容复制');return}
if(a==='workspace-source'){const name=S.page==='customer'?M.customers[S.customer]:'当前可见合同',p=S.page==='customer'?AM.customer(S.customer,S.customerScope):AM.portfolio(S.portfolioScope),cs=p.contracts;drawer('分析依据与数据覆盖 · '+name,fields([['内部数据','真实测试系统快照，数据截至'+M.ASOF],['分析对象',cs.length+'份可见合同；先按授权项目过滤'],['企业信用','未取得外部有效等级、事件及更新时间'],['舆情','拟复用AI招商/统一中台；未取得覆盖或有效事件'],['保证金','部分账单已取得，完整有效余额未取得'],['历史合作','完整历史合同与终止重签关系未取得']])+`<h3>本次可核验合同</h3>${AV.contractRows(cs)}<h3>指标与判断</h3><p class="helper">同一合同、同一批租金账单满足应收=已收+逾期未缴+未到期待缴。风险按唯一合同去重；欠租、外部高等级有效风险、保障阈值可命中，临期独立提醒。资料待核验可与风险重叠，不能与风险数相加。</p><p class="helper">企业信用与舆情按主体匹配、核验有效日期及来源，不凭欠租反推信用等级；外部风险1级最低5级最高。当前没有取得可核验的外部风险事件。</p>`);return}
}
function sources(i){const a=activeSession()?.messages[Number(i)]?.a;if(!a)return;drawer('数据来源与指标口径',fields([['查询范围',M.scopes[a.scope]],['截至时间',a.asof],['当前期间',a.period],['统计方式','授权过滤后聚合'],['数据性质','测试系统只读快照'],['结果类型',a.kind]])+`<h3>计算口径</h3><p>租金应收按已载入全周期租金账单汇总，含未到期账单；租金已收按账单实收列及待收余额核对。逾期未缴取应收日早于截至日的待收余额。保证金单列；完整可租资产未载入时不计算出租率。</p><h3>本次依据</h3><div class="source-list">${a.evidence.map(x=>`<div>${e(x)}</div>`).join('')}</div><p class="caption">快照回看保留原查询结果；生产环境查看历史时仍须重新校验权限。详细数据覆盖与更新时间需由真实接口提供。</p>`)}
function downloadCSV(i){const a=activeSession()?.messages[Number(i)]?.a;if(!a?.rows.length)return;const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';const data='\uFEFF'+[a.columns,...a.rows.map(r=>r.values)].map(r=>r.map(quote).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='问数结果_'+a.kind+'_'+a.asof+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function navigate(page){stop(false);S.page=page;location.hash=page;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const v=b.dataset.value,a=b.dataset.action;
if(a==='close')close();
else if(a.startsWith('workspace-')||['portfolio-filter','analysis-contract','analysis-customer','customer-tab'].includes(a))workspaceAction(a,v);
else if(a==='page')navigate(v);
else if(a==='tab'){S.tab=v;S.reply=null;render()}
else if(a==='cq'){close();question(v)}
else if(a==='radar-mode'){S.radarMode=v;render()}
else if(a==='refresh')refreshAnalysis();
else if(a==='enterprise')enterprise();
else if(a==='changes')changes();
else if(a==='policy')policy();
else if(a==='escalation-policy')escalationPolicy();
else if(a==='issue-policy')issuePolicy(v);
else if(a==='issue-generate'){S.issueAdvice[S.contract+'|'+v]=true;close();render();notify('已生成建议事项；来源已标明，未执行业务操作')}
else if(a==='risk')riskDetails(v);
else if(a==='risk-assistant'){const signal=M.riskSignals(S.contract).find(r=>r.code===v);close();S.tab='合同助手';if(signal)question(signal.question);else render()}
else if(a==='dimensions')dimensions();
else if(a==='contractsource')contractSource();
else if(a==='billlist'){const c=M.contract(S.contract);drawer('账单与收款核对 · '+c.id,billTable(c)+(c.unallocated?`<div class="note">已到账待分配：RC-A01-01，${M.money(c.unallocated)}，2026-11-07。当前未抵减账单余额。</div>`:''),`${btn('查看财务台账','gotobills','','primary small')}<span>账单状态取自生效核销数据</span>`)}
else if(a==='gotobills'){close();S.tab='财务收支台账';render();window.scrollTo({top:0,behavior:'smooth'})}
else if(a==='bill'){const bill=M.bills.find(x=>x.id===v);drawer('账单依据 · '+v,fields([['关联对象',bill.contract],['计费期',bill.period],['费用项',bill.fee],['应收',M.money(bill.ar)],['租金已收',M.money(bill.paid)],['待缴',M.money(bill.balance)],['按期核销',M.money(bill.timely)],['到期日',bill.due],['逾期余额',M.money(bill.overdue)]]))}
else if(a==='renew')renew();
else if(a==='draft')draft('collection',v);
else if(a==='collection-policy')collectionRule(v);
else if(a==='template-channel'){stashCollectionEdit();collectionDraft(S.collectionContext?.billId,v)}
else if(a==='template-reset'){const d=S.collectionContext;if(d){delete S.collectionEdits[d.key];collectionDraft(d.billId,d.channel)}}
else if(a==='copy-template'){const text=$('#draft-text')?.value||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>notify('话术已复制，未发送')).catch(()=>notify('复制未获允许，请选择正文手动复制'));else notify('请选择正文手动复制')}
else if(a==='task')draft('task');
else if(a==='savedraft'){const text=$('#draft-text')?.value||'';if(!text.trim()){notify('请填写草稿内容');return}S.drafts.push({contract:S.contract,type:S.draftType,text,billId:S.collectionContext?.billId,channel:S.collectionContext?.channel,stage:S.collectionContext?.stage});close();render();notify('已保存本地草稿，业务数据未变更')}
else if(a==='draftlist'){drawer('本次演示草稿',S.drafts.filter(x=>x.contract===S.contract).map(x=>`<div class="scene-card"><h3>${x.type==='task'?'跟进待办':'催缴话术 · '+e(x.stage||'')+' · '+e(x.channel||'')}</h3>${x.billId?`<p class="caption">${e(x.billId)}</p>`:''}<p style="white-space:pre-wrap">${e(x.text)}</p></div>`).join(''))}
else if(a==='new')newSession();
else if(a==='ask')ask(v);
else if(a==='stop')stop();
else if(a==='history'){stop(false);const ss=S.sessions.find(x=>x.id===v);if(ss){S.active=v;S.scope=ss.scope;render()}}
else if(a==='retry'){if(S.busy){notify('请先停止当前生成');return}const ss=activeSession(),old=ss?.messages[Number(v)];if(!old)return;const fork={...ss,id:'s'+Date.now(),time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:ss.messages.slice(0,Number(v)).map(m=>({...m}))};S.sessions.unshift(fork);S.active=fork.id;ask(old.q)}
else if(a==='sources')sources(v);
else if(a==='export')downloadCSV(v);
else if(a==='opencontract'){S.returnWorkspace=null;stop(false);S.contract=v;S.tab='合同助手';S.reply=null;S.returnAsk=true;navigate('contract')}
else if(a==='gotoask'){close();navigate('ask')}
else if(a==='scenes'){S.scene=v||S.page;showScenes(S.scene)}
else if(a==='scene-tab')showScenes(v);
else if(a==='scene-contract'){close();S.tab='合同助手';navigate('contract');question(v)}
else if(a==='scene-ask'){close();stop(false);S.active=null;if(v.includes('查看上次查询结果')){const q='哪些合同欠费需要催缴',answer=M.answer(q,S.scope),ss={id:'s'+Date.now(),title:q,scope:S.scope,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:[{q,a:answer,shown:answer.text,status:'done'}]};S.sessions.unshift(ss);S.active=ss.id;navigate('ask');ask('按项目分组')}else{navigate('ask');ask(v)}}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='ask-form'){ev.preventDefault();ask($('#question').value)}});
document.addEventListener('change',ev=>{if(ev.target.id==='portfolio-scope'){S.portfolioScope=ev.target.value;S.portfolioFilter='all';render();return}if(ev.target.id==='customer-select'){S.customer=ev.target.value;S.customerRadarMode='actual';S.customerTab='客商助手';render();return}if(ev.target.id==='customer-scope'){S.customerScope=ev.target.value;render();return}if(ev.target.id==='template-bill'){stashCollectionEdit();collectionDraft(ev.target.value);return}if(ev.target.id==='contract-select'){S.contract=ev.target.value;S.reply=null;render()}if(ev.target.id==='scope-select'){stop(false);S.scope=ev.target.value;S.active=null;render();notify('已切换查询范围，新问题将按所选项目查询')}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#overlay').children.length)close();if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='question'&&!ev.isComposing){ev.preventDefault();ask(ev.target.value)}if(ev.key==='Tab'&&$('#overlay').children.length){const xs=[...$('#overlay').querySelectorAll('button,a,textarea,select,input')].filter(x=>!x.disabled);if(ev.shiftKey&&document.activeElement===xs[0]){ev.preventDefault();xs.at(-1)?.focus()}else if(!ev.shiftKey&&document.activeElement===xs.at(-1)){ev.preventDefault();xs[0]?.focus()}}});
window.addEventListener('hashchange',()=>{const page=initialPage();if(page!==S.page){stop(false);S.page=page;render()}});
seed();render();
})();
</script></body></html>
