else if(S.tab==='资产与工单')body=card('合同关联资产',fields([['资产编号',c.asset],['房号',c.room],['占用面积',c.area+'㎡'],['项目',M.scopes[c.project]]]))+card('工单数据','<p class="small muted">当前演示未提供完整维修工单与履约义务关联。暂不输出故障率、维修及时性或责任认定。</p>');
else if(S.tab==='变更历史'){const ch=M.changeProfiles[c.id];body=card('当前合同变更历史',ch?table(['变更单','生效日期','类型','说明'],ch.events.map(x=>[e(x.id),x.date,e(x.type),e(x.detail)]))+'<p class="caption">仅统计当前合同已生效记录；重签不当作本合同变更。示例记录不是生产数据。</p>':'<p class="small muted">变更来源未取得，不能认定为零次变更。</p>');}
else body=card('合同生命周期',`<div class="timeline"><div><p>已签约 / 履约中</p><small>开始日期：2026-01-01</small></div><div><p>${c.days<=90?'已进入续签准备窗口':'尚未进入90天续签准备窗口'}</p><small>截止 ${M.ASOF}，距结束日期 ${c.days} 天</small></div><div><p>合同结束</p><small>${c.end}；续签或退出需执行原业务流程</small></div></div>`);
return title+body+`<div class="demo-bar"><span>当前合同锁定：${c.id} · 分析截至 ${M.ASOF}</span><span>原型演示，金额与客户均为合成样例</span></div>`}
function fields(xs){return `<dl class="fields">${xs.map(([a,b])=>`<div><dt>${e(a)}</dt><dd>${e(b)}</dd></div>`).join('')}</dl>`}
function assistant(c){const r=M.contractReport(c.id);return `<div class="assistant-header"><div><h2>合同助手</h2> ${tag('当前合同 · 自动分析')}<p>结合履约事实、主体经营与项目规则，给出分析结论及可执行的跟进建议。</p></div><div class="analysis-toolbar"><span>上次分析 ${e(analysisTime())}</span>${btn('重新分析','refresh','','small')}<small>源数据截至 ${M.ASOF} · 合成样例</small></div></div>`+kpis([{label:'租金应收',value:c.ar,unit:'元',note:'当前期间生效账单'},{label:'已核销',value:c.paid,unit:'元',note:'回款完成率 '+M.pct(c.paid,c.ar)+'%'},{label:'逾期未核销',value:c.overdue,unit:'元',tone:c.overdue?'red':'',note:c.overdue?'最长逾期 '+r.advice.age+' 天':'当前无逾期余额'},{label:'距合同到期',value:c.days,unit:'天',note:c.end+(c.days<=90?' · 到期提醒保留':'')}])+`<div class="overview-grid report-layout">`+card('履约五维雷达',radar(c)+`<div class="radar-legend">${tag('表现较好 '+r.good,'green')}${tag('需要关注 '+r.attention,'amber')}${tag('重点核验 '+r.risk,'red')}${r.missing?tag('数据待补 '+r.missing):''}</div><p class="caption">演示分档：≥90表现较好；60—89关注；＜60重点核验。正式分档待业务确认。</p>`,btn('查看维度口径','dimensions','','link small'))+`<section class="card report-card"><div class="card-head"><h3>履约分析与行动建议</h3>${btn('查看全部依据','contractsource','','link small')}</div><div class="report-summary"><b>${r.risk?'存在需要重点核验的履约信号':r.attention?'存在需要持续跟进的履约事项':'当前可核验维度整体平稳'}</b><p>五个维度中，${r.good}项表现较好、${r.attention}项需要关注、${r.risk}项重点核验${r.missing?'、'+r.missing+'项数据待补':''}。${c.overdue?'优先核对 '+M.money(c.overdue)+' 逾期款项'+(c.unallocated?'及 '+M.money(c.unallocated)+' 到账待分配':'')+'。':'当前无逾期余额，仍需结合主体信息与合同条款持续观察。'}</p></div><div class="report-scroll">${r.blocks.map((b,i)=>`<details class="analysis-item" ${i===0?'open':''}><summary><span><i>${String(i+1).padStart(2,'0')}</i>${e(b.title)}</span>${tag(b.status,b.status.includes('不足')||b.status.includes('重点')?'red':b.status.includes('缺')||b.status.includes('待')||b.status.includes('关注')||b.status.includes('跟进')?'amber':'green')}</summary><div class="analysis-content"><h4>当前事实</h4><p>${e(b.fact)}</p><h4>分析解读</h4><p>${e(b.analysis)}</p><div class="advice-block"><h4>行动建议</h4><p>${e(b.advice)}</p></div><p class="caption">依据 / 建议来源：${e(b.source)}</p><div class="row">${btn(b.label,b.action,'','link small')}${b.key==='payment'?btn('查看项目规则','policy','','link small')+btn('生成催缴草稿','draft','','link small'):''}</div></div></details>`).join('')}${r.expiry?`<details class="analysis-item"><summary><span><i>06</i>${e(r.expiry.title)}</span>${tag('到期提醒','amber')}</summary><div class="analysis-content"><p>${e(r.expiry.fact)}</p><div class="advice-block"><h4>行动建议</h4><p>${e(r.expiry.advice)}</p></div>${btn('查看续签准备','renew','','link small')}</div></details>`:''}</div><p class="caption report-footer">分析时间 ${e(analysisTime())} · 源数据截至 ${M.ASOF} · ${btn('生成跟进待办草稿','task','','link small')}</p></section></div>`+(S.reply?card('维度分析结果',contractReply(c,S.reply)):'')+draftNotice(c)}
function draftNotice(c){const n=S.drafts.filter(x=>x.contract===c.id).length;return n?`<div class="draft-list">本次演示已保存 ${n} 份本地草稿。${btn('查看草稿','draftlist','','link small')} · 草稿保存不改变合同账单状态。</div>`:''}
function contractAnalysis(c,q){let title='履约核查结果',text='',action='contractsource';
if(/所有|整体|哪些合同|多少合同|各项目/.test(q))return{title:'请前往智能问数查看整体数据',text:'当前助手仅分析 '+c.id+'。全域合同、资产、客商、账单的统计与对比可进入驾驶舱下的智能问数。',action:'gotoask'};
if(/企业|主体|经营风险/.test(q)){const b=M.contractReport(c.id).blocks.find(b=>b.key==='enterprise');title=b.title;text=b.fact+' '+b.analysis+' 建议：'+b.advice;action='enterprise';}
else if(/变更|稳定/.test(q)){const b=M.contractReport(c.id).blocks.find(b=>b.key==='stability');title=b.title;text=b.fact+' '+b.analysis+' 建议：'+b.advice;action='changes';}
else if(/保证金/.test(q)){title='保证金核验';text=c.deposit?`有效保证金 ${M.money(c.deposit[0])}，应缴 ${M.money(c.deposit[1])}，缺口 ${M.money(Math.max(0,c.deposit[1]-c.deposit[0]))}。保证金与租金分别核算。`:'当前未取得保证金应缴和有效余额数据，无法判断是否交齐。建议财务补充保证金条款、到账、抵扣和退还记录。';}
else if(/到期|续签/.test(q)){title='到期与续签准备';text=`合同于 ${c.end} 结束，距 ${M.ASOF} 尚有 ${c.days} 天。`+(c.renew?`已进入90天准备窗口，准备清单完成 ${c.renew[0]} / ${c.renew[1]} 项。建议确认续签意向、审批方案并跟踪协议签署。准备完成率不代表续签概率。`:'尚未进入90天准备窗口，可按现有履约计划继续跟踪。');action='renew';}
else if(/已经|已付|到账|付过|分配/.test(q)){title='到账与核销差异核对';text=`当前账单未核销 ${M.money(c.balance)}。`+(c.unallocated?`另有收款 RC-A01-01，2026-11-07到账 ${M.money(c.unallocated)}，已关联当前合同，尚未分配至账单。因此当前仍显示原逾期 ${M.money(c.overdue)}。请财务核对后完成正式分配，再重新分析。`:'当前未取得已确认关联本合同的待分配到账。请核对付款凭证、收款流水和核销记录。');action='billlist';}
else if(/及时|历史|迟付/.test(q)){title='付款及时性';text=`到期应收 ${M.money(c.ar)}，按期核销 ${M.money(c.timely)}，按期回款完成率 ${M.pct(c.timely,c.ar)}%。已核销中有 ${M.money(c.latePaid)} 属于历史迟付，已结清部分不会重复计入当前欠费。当前逾期余额 ${M.money(c.overdue)}。`;action='billlist';}
else if(/催缴|催收|下一步|风险|处理|跟进/.test(q)){title='处理建议与催缴准备';text=c.overdue?`当前合同逾期未核销 ${M.money(c.overdue)}。${c.unallocated?'请优先核对 '+M.money(c.unallocated)+' 已到账待分配款项；':''}建议由 ${c.owner} 复核账单与收款，再生成催缴草稿并确认发送方式。${c.renew?'同时跟踪 '+c.end+' 到期前的续签准备。':''}实际收款和任务完成需回到原业务流程确认。`:'当前无逾期余额，无需针对当前账单生成逾期催缴。可继续关注后续付款节点与到期安排。';action=c.overdue?'draft':'contractsource';}
else if(/账单|交费|缴费|欠|应收|回款|付款|未交|没交/.test(q)){title='当前账单与未缴核查';text=`当前期间应收 ${M.money(c.ar)}，已核销 ${M.money(c.paid)}，未核销 ${M.money(c.balance)}，其中逾期 ${M.money(c.overdue)}。${c.bills.filter(b=>b.balance>0).map(b=>b.id+' 未核销 '+M.money(b.balance)+'，到期日 '+b.due+'。').join('')}${c.unallocated?'另有 '+M.money(c.unallocated)+' 到账待分配，暂不冲减账单余额。':''}`;action='billlist';}
else{title='请补充要核查的履约问题';text='可询问当前合同的账单未缴、催缴、到账差异、保证金、付款及时性或续签准备。此原型按预设业务场景演示，真实语言理解由企业中台承担。'}
return{title,text,action};}
function contractReply(c,q){const a=contractAnalysis(c,q),labels={billlist:'查看账单与收款',draft:'生成催缴草稿',renew:'查看续签清单',contractsource:'查看数据依据',gotoask:'进入智能问数',enterprise:'查看企业信息',changes:'查看变更记录'};return `<div class="contract-answer" id="contract-reply"><div class="answer-meta"><span class="ai-badge">AI</span>当前合同 ${c.id} · 模拟回答</div><h4>${e(a.title)}</h4><p>${e(a.text)}</p><div class="row">${btn(labels[a.action],a.action,'','link small')}${btn('生成跟进待办草稿','task','','link small')}</div></div>`}
function question(cq){S.reply=cq;render();$('#contract-reply')?.scrollIntoView({behavior:'smooth',block:'center'})}
function queryChips(){return `<div class="query-chips"><span>试着问</span>${[['经营概览','当前整体经营概览'],['合同规模','合同规模与到期分布'],['项目回款','各项目回款情况怎么样'],['资产空置','资产规模与空置情况'],['年底待回收','年底前还有多少账单待回收？'],['无匹配数据','逾期超过100万元的合同有哪些？'],['无权限示例','新城中心回款情况如何？'],['同比数据不足','今年收入同比增长多少？']].map(([t,q])=>btn(t,'ask',q,'question-chip')).join('')}</div>`}
function queryPage(){const active=S.sessions.find(x=>x.id===S.active);return `<div class="breadcrumb">经营驾驶舱 / 智能问数</div><div class="title-row"><div><h1>智能问数</h1><p>直接说出关注的项目和指标，查看经营数据及分析解读。</p></div>${btn('新建会话','new','','primary small')}</div><div class="query-context"><span>按当前账号权限查询 · 在问题中指定项目可进一步缩小范围</span><span>数据截至 ${M.ASOF} · 合成样例</span></div><div class="query-layout"><section class="conversation"><div class="conversation-top"><h3>${active?e(active.title):'开始一次经营分析'}</h3>${tag(S.busy?'正在生成…':'AI 问数')}</div><div class="chat-log" id="chat-log">${active?active.messages.map((m,i)=>message(m,i)).join(''):welcome()}</div>${queryChips()}<form class="composer" id="ask-form"><div class="input-frame"><textarea id="question" aria-label="智能问数问题" placeholder="例如：创智中心还有哪些合同欠费？按合同列出来。" ${S.busy?'disabled':''}></textarea><div class="input-bottom"><span>Enter 发送 · Shift + Enter 换行</span>${S.busy?btn('停止生成','stop','','small'):'<button class="primary" type="submit">发送</button>'}</div></div><p class="composer-note">结果含统计范围、数据时点和来源。无权限、无匹配记录、数据不足分别展示；此页面为合成数据演示。</p></form></section><aside class="history-panel"><div class="row between"><h3>历史会话</h3><span class="small muted">${S.sessions.length} 条</span></div><p>选择会话，回看当时的数据与分析</p><div class="history-label">演示问答与本地记录</div>${S.sessions.map(x=>`<button class="history-item ${x.id===S.active?'selected':''}" data-action="history" data-value="${e(x.id)}"><b>${e(x.title)}</b><small>${e(x.time)} · ${e(M.scopes[x.scope])} · ${x.messages.length}轮</small></button>`).join('')||'<div class="empty">暂无会话</div>'}<div class="history-footer">范围：资产、客商、合同、账单与收款。<br>历史保留原查询快照；需要最新数据时重新生成。</div></aside></div><div class="demo-bar"><span>左侧查询数据 + 分析解读 · 右侧历史回看</span>${btn('查看问数落地场景（'+M.SCENES.filter(x=>x.agent==='ask').length+'）','scenes','ask','link small')}</div>`}
function welcome(){return `<div class="welcome compact-welcome"><p class="eyebrow">BUSINESS INSIGHTS</p><h2>从经营问题，找到具体行动</h2><p>可询问经营、合同、款项、资产规模；指定项目无需另选筛选器。<br>右侧已准备完整问答，支持查看有数据、无数据与无权限的展示。</p></div>`}
function message(m,i){return `<article><div class="user-message"><div>${e(m.q)}</div></div><div class="answer-message"><div class="answer-meta"><span class="ai-badge">AI</span> 智能问数 <span class="muted">${M.scopes[m.a.scope]}</span></div><div class="answer-body" id="stream-${i}">${e(m.shown||'')}${m.status==='streaming'?'<span class="stream-line"></span>':''}</div>${m.status==='streaming'?'<p class="progress-text">已读取授权数据，正在组织结果…</p>':m.status==='stopped'?`<p class="progress-text">已停止生成，当前内容未完成。</p>${btn('重新生成','retry',i,'link small')}`:resultCard(m.a,i)}</div></article>`}
function resultCard(a,i){return `<div class="answer-result"><div class="result-section-label">${a.rows.length?'01 · 查询数据':'查询状态'}</div><h3>${e(a.title)}</h3>${a.metrics.length?kpis(a.metrics):''}${a.chart.length?chart(a):''}${a.rows.length?table(a.columns,a.rows.map(r=>r.values.map((v,j)=>j===0&&r.id?btn(v,'opencontract',r.id,'link small'):e(v)))):''}${a.insights?.length?`<section class="insight-section"><h4>02 · 分析解读</h4>${a.insights.map(t=>`<p>${e(t)}</p>`).join('')}</section>`:''}<div class="answer-actions">${a.evidence.length?btn('查看数据来源与口径','sources',i,'link small'):`<span class="small muted">${a.kind==='denied'?'未查询目标项目数据':a.kind==='empty'?'查询成功，未发现匹配记录':'当前问题需要补充数据或范围'}</span>`}<div class="row">${btn('重新生成','retry',i,'link small')}${a.rows.length?btn('导出结果 CSV','export',i,'link small'):''}</div></div><p class="result-stamp">截至 ${a.asof} · ${e(M.scopes[a.scope])} · 查询快照</p></div><div class="followups">${a.followups.map(q=>btn(q,'ask',q,'small')).join('')}</div>`}
function chart(a){const max=Math.max(...a.chart.map(x=>x.value??0),1);return `<div class="bar-chart"><p class="bar-title">${e(a.chartTitle)}</p>${a.chart.map(x=>`<div class="bar-row"><span>${e(x.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,x.value??0)/max*100}%"></div></div><span class="bar-value">${x.value===null?'—':x.value.toLocaleString('zh-CN')}</span></div>`).join('')}</div>`}
function scrollChat(){const el=$('#chat-log');if(el)el.scrollTop=el.scrollHeight}
function activeSession(){return S.sessions.find(x=>x.id===S.active)}
function stop(show=true){if(S.timer){clearInterval(S.timer);S.timer=null}if(S.busy){const m=activeSession()?.messages.at(-1);if(m)m.status='stopped';S.busy=false;save();if(show)render()}}
function newSession(){stop(false);S.active=null;render();$('#question')?.focus()}
function ask(q){q=q.trim();if(!q||S.busy)return;let session=activeSession();if(!session){session={id:'s'+Date.now(),title:q.slice(0,60),scope:S.scope,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:[]};S.sessions.unshift(session);S.sessions=S.sessions.slice(0,30);S.active=session.id}const prev=session.messages.at(-1)?.a;const a=M.answer(q,session.scope,prev);const m={q,a,shown:'',status:'streaming'};session.messages.push(m);S.busy=true;if($('#question'))$('#question').value='';render();let n=0;S.timer=setInterval(()=>{n+=8;m.shown=a.text.slice(0,n);const el=$('#stream-'+(session.messages.length-1));if(el){el.textContent=m.shown;const c=document.createElement('span');c.className='stream-line';el.appendChild(c);scrollChat()}if(n>=a.text.length){clearInterval(S.timer);S.timer=null;m.status='done';S.busy=false;save();render()}},26)}
function drawer(title,body,foot=''){const prev=document.activeElement;S.previousFocus=prev;$('#overlay').innerHTML=`<div class="overlay-screen"><section class="drawer" role="dialog" aria-modal="true" aria-label="${e(title)}"><header class="drawer-head"><div><h2>${e(title)}</h2><p>海开资管 · 双智能体原型</p></div>${btn('关闭','close','','small')}</header><div class="drawer-body">${body}</div>${foot?`<footer class="drawer-foot">${foot}</footer>`:''}</section></div>`;$('#overlay [data-action="close"]').focus()}
function close(){const f=S.previousFocus;$('#overlay').innerHTML='';if(f?.isConnected)f.focus()}
function dimensions(){const c=M.contract(S.contract);drawer('履约雷达 · 维度口径',`<p class="helper">五轴独立展示：三项完成率 + 两项演示规则映射分。不合成信用评级。企业风险与合同变更来源缺失时显示—，不填0。</p>${M.radar(c.id).map(a=>`<div class="scene-card"><h3>${e(a.label)} ${tag(a.value===null?'—':a.value+(a.unit||'%'))}</h3><p>${e(a.fact)}</p><p class="caption">${e(a.formula)}</p>${btn('查看维度分析','cq',a.question,'link small')}</div>`).join('')}`)}
function enterprise(){const c=M.contract(S.contract),ep=M.enterpriseProfiles[c.customer];drawer('企业经营与风险依据 · '+c.name,fields([['签约主体',c.name],['匹配标识','客商主数据 '+c.customer+'（演示映射）'],['来源',ep?.source||'未取得'],['数据更新',ep?.updated||'未取得']])+ (ep?`<div class="note">当前为合成样例，未调用企查查；生产需校验统一主体标识、接口授权、事件有效性与更新时间。</div>`+fields([['登记状态',ep.status],['经营异常',ep.abnormal+'项'],['司法风险',ep.judicial+'项'],['风险等级',ep.riskLevel+'/5（演示规则）']])+`<h3>事件依据</h3><div class="source-list">${ep.refs.map(t=>`<div>${e(t)}</div>`).join('')}</div><p class="helper">外部信号用于辅助核验，不等同于该合同违约。第三方详情链接需由真实接口提供，本原型不伪造来源链接。</p>`:'<div class="note">企业信息未取得，当前无法判断经营风险。请补齐主体映射与已授权数据来源后分析。</div>'))}
function changes(){const c=M.contract(S.contract),ch=M.changeProfiles[c.id];drawer('当前合同变更记录 · '+c.id,ch?table(['变更单','生效日期','类型','说明','状态'],ch.events.map(x=>[e(x.id),x.date,e(x.type),e(x.detail),e(x.status)]))+`<p class="helper">本表仅当前合同的已生效变更；未记录事件不代表已证明合同条款完全无风险。重签新合同不计为本合同变更。观察期2026-01-01至${M.ASOF}，示例规则分需业务确认。</p>`:'<div class="note">变更记录未取得，不能按零次变更计算稳定分。</div>')}
function policy(){const c=M.contract(S.contract),p=M.projectPolicies[c.project],ad=M.collectionAdvice(c);drawer('项目催缴规则与建议来源',fields([['合同项目',M.scopes[c.project]],['规则状态',p?'已配置（演示样例）':'未配置'],['当前建议来源',ad.source],['最长逾期',ad.age+'天'],['当前阶段',ad.stage]])+(p?table(['逾期天数上限','处理阶段','配置动作','留痕要求'],p.stages.map(x=>[Number.isFinite(x.maxDays)?x.maxDays+'天':'90天以上',e(x.name),e(x.action),e(x.evidence)])):'<div class="note">项目未配置规则，展示AI参考建议。AI不把通用建议冒充客户制度，也不自行决定发律师函或终止合同。</div>')+`<h3>本合同建议</h3><p>${e(ad.action)}</p><p>${e(ad.evidence)}</p><p class="caption">配置优先：传入规则ID、版本、适用阶段与动作；AI补充沟通方式、执行步骤和证据留存，不能越过生效规则。</p>`)}
function contractSource(){const c=M.contract(S.contract);drawer('当前合同 · 分析依据',fields([['合同范围',c.id],['签约客商',c.name],['期间',M.PERIOD],['截至时间',M.ASOF],['数据类型','合成演示数据'],['生效版本',S.contract==='HT-A01'?'V3（两次生效变更样例）':'V1（演示）']])+`<h3>账单依据</h3>${billTable(c)}<h3>其他依据</h3><div class="row">${btn('企业经营信息','enterprise','','link small')}${btn('合同变更记录','changes','','link small')}${btn('项目催缴规则','policy','','link small')}</div><div class="source-list"><div>合同期限：${c.id} / end_date = ${c.end}</div><div>保证金：${c.deposit?M.money(c.deposit[0])+' / '+M.money(c.deposit[1]):'来源缺失，无法判断'}</div><div>准备清单：${c.renew?c.renew.join(' / ')+' 项':'当前不适用'}</div>${c.unallocated?`<div>RC-A01-01：2026-11-07到账 ${M.money(c.unallocated)}，已关联合同但未核销。</div>`:''}</div><p class="caption">生产接口还需提供源记录更新时间、合同版本、核销分配ID与权限范围。本页不代表已连接真实系统。</p>`)}
function renew(){const c=M.contract(S.contract);const labels=['续签意向已确认','续签方案已审批','续签协议已签署'];drawer('续签准备 · '+c.id,`<div class="note">合同结束日 ${c.end}，剩余 ${c.days} 天。${c.renew?'已进入90天准备窗口。':'当前尚未进入准备窗口。'}</div>${table(['准备事项','当前状态','责任角色'],labels.map((t,i)=>[e(t),c.renew?(i<c.renew[0]?tag('已完成','green'):tag('待推进','amber')):tag('当前不适用'),['招商经办','部门负责人','签约经办'][i]]))}<h3>推进建议</h3><p>先确认续签意向，再结合欠费与保证金核验，推进方案审批和协议签署；不续签时进入退出、结算与资产回收流程。</p><p class="caption">这些状态是原型准备清单；生产需映射资管已有的续签及审批记录。</p>`,`${btn('生成跟进待办草稿','task','','primary')}<span>仅保存演示草稿，不修改合同期限</span>`)}
function draft(type='collection'){const c=M.contract(S.contract);if(type==='collection'&&!c.overdue){notify('当前合同无逾期未核销账单');return}S.draftType=type;
const matched=M.collectionAdvice(c);
const text=type==='collection'?`${c.name}：\n关于合同 ${c.id}（${M.scopes[c.project]}，${c.room}），截至 ${M.ASOF}，租金账单逾期未核销合计 ${M.money(c.overdue)}。\n${c.bills.filter(b=>b.overdue>0).map(b=>`账单 ${b.id}；到期日 ${b.due}；未核销 ${M.money(b.balance)}`).join('\n')}\n${c.unallocated?'核账提示：另有 '+M.money(c.unallocated)+' 已到账待分配，请财务先完成核对并更新本草稿金额。\n':''}请协助核对付款情况；如已付款，请提供付款凭证，以便财务核销。\n联系人：${c.owner}（演示负责人）\n【草稿待复核，未发送】`:`待办主题：${c.id} 履约事项跟进\n负责人：${c.owner}\n1. 核对账单未核销 ${M.money(c.balance)}${c.unallocated?'及已到账待分配 '+M.money(c.unallocated):''}。\n2. 检查保证金资料与当前有效余额。\n3. ${c.renew?'推进续签准备清单，当前完成 '+c.renew.join('/')+' 项。':'跟踪后续履约与到期节点。'}\n完成后需复核源数据并重新分析，任务完成不代表欠费结清。\n【本地演示待办草稿】`;
drawer(type==='collection'?'催缴内容草稿 · 待核账':'跟进待办草稿',`<p class="helper">基于 ${c.id} 的当前事实生成。建议来源：${e(matched.source)}；${e(matched.action)}。${e(matched.evidence)}。可编辑后保存本地草稿，正式发送由业务流程承接。</p>${c.unallocated?'<div class="note">发现已到账待分配款项，需先核账再确认催缴金额。</div>':''}<textarea id="draft-text" aria-label="草稿内容">${e(text)}</textarea>`,`${btn('保存本地草稿','savedraft','','primary')}<span>未发送、未派单、未变更财务数据</span>`)}
function showScenes(tab){if(tab)S.scene=tab;const tabs=`<div class="scene-tabs">${btn('合同助手 · 8个场景','scene-tab','contract',S.scene==='contract'?'primary':'')}${btn('智能问数 · '+M.SCENES.filter(x=>x.agent==='ask').length+'个场景','scene-tab','ask',S.scene==='ask'?'primary':'')}${btn('页面与接入流程','scene-tab','flow',S.scene==='flow'?'primary':'')}</div>`;
const content=S.scene==='flow'?flow():M.SCENES.filter(x=>x.agent===S.scene).map(x=>`<article class="scene-card"><h3>${e(x.id+' '+x.title)} ${tag(x.role)}</h3><dl>${[['角色问法',x.question],['所需数据',x.data],['处理与展示',x.flow],['验收样例',x.accept],['边界',x.boundary]].map(([a,b])=>`<dt>${e(a)}</dt><dd>${e(b)}</dd>`).join('')}</dl>${btn('演示这个问题',x.agent==='contract'?'scene-contract':'scene-ask',x.question,'link small mini-space')}</article>`).join('');
drawer('核心场景与落地流程',tabs+content,`<a href="核心落地方案.html" target="_blank" rel="noopener">打开完整核心落地方案</a><a href="核心原型资料包_V3.0.zip" download>下载原型与方案</a>`)}
function flow(){return `<h3>合同助手：在合同详情完成单份合同核查</h3><div class="flow-list"><div>01 · 合同台账 → 合同详情 → 合同助手 Tab<small>携带当前合同ID；进入即展示当前数据范围。</small></div><div>02 · 资管取数、校验并计算<small>复用单合同业务API，补充企业信息、合同变更、保证金与项目催缴规则；按需封装为受控工具/MCP。</small></div><div>03 · 企业中台分析并返回<small>资管后端通过 BaseURL + API 调用合同助手，返回结论、维度指标、建议和证据。</small></div><div>04 · 资管展示 → 核对明细 → 人工处理 → 重新分析<small>雷达、账单、准备清单和草稿；正式收款、发出催缴、派单、续签均由已有业务流程处理。</small></div></div><h3>智能问数：驾驶舱下的连续对话</h3><div class="flow-list"><div>01 · 驾驶舱 → 智能问数 → 直接提出业务问题<small>覆盖用户有权访问的资产、客商、合同、账单等业务数据。</small></div><div>02 · 企业中台识别问题 → 资管数据接口执行查询<small>业务数据同步到AI专用视图/中间表或数据仓库，统一指标口径；中台仅查询已授权的数据层，不直接面对业务全表。</small></div><div>03 · 结果流式返回 → 左侧展示<small>状态、文字增量、指标、图表、表格、证据依次呈现；可停止和重新生成。</small></div><div>04 · 继续追问 / 合同下钻 / 右侧历史回看<small>按会话保留上下文与结果快照。历史不自动刷新，重新查询生成新快照。</small></div></div><h3>双方系统怎么连接</h3><p>资管页面 → 资管后端 → 企业AI中台（BaseURL + API）→ 资管后端校验结果 → 页面展示。合同助手复用业务API与受控工具；智能问数依托AI专用视图/中间表或数据仓库，先治理再查询。中台通过双方约定的受控业务API查询授权数据；合同助手优先由资管后端提供单合同事实快照。</p><div class="note">BaseURL、鉴权密钥、智能体应用ID和接口路径在服务端配置。中台真实协议尚需双方联调确认，详细方案提供的是拟定适配协议。</div><p class="helper">当前页面为可操作的前端原型：合成数据、规则样例、本地草稿和历史、模拟流式展示。真实中台与业务API尚未接入。</p>`}
function sources(i){const a=activeSession()?.messages[Number(i)]?.a;if(!a)return;drawer('数据来源与指标口径',fields([['查询范围',M.scopes[a.scope]],['截至时间',a.asof],['当前期间',a.period],['统计方式','授权过滤后聚合'],['数据性质','合成样例'],['结果类型',a.kind]])+`<h3>计算口径</h3><p>租金应收为当前期间生效租金账单；已核销为对应账单的有效分配金额；逾期为到期日早于截至日且仍未核销的余额。保证金与租金账单独立统计。面积出租率为去重资产快照的已租面积 / 可租面积。</p><h3>本次依据</h3><div class="source-list">${a.evidence.map(x=>`<div>${e(x)}</div>`).join('')}</div><p class="caption">快照回看保留原查询结果；生产环境查看历史时仍须重新校验权限。详细数据覆盖与更新时间需由真实接口提供。</p>`)}
function downloadCSV(i){const a=activeSession()?.messages[Number(i)]?.a;if(!a?.rows.length)return;const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';const data='\uFEFF'+[a.columns,...a.rows.map(r=>r.values)].map(r=>r.map(quote).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='问数结果_'+a.kind+'_'+a.asof+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function navigate(page){stop(false);S.page=page;location.hash=page;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const v=b.dataset.value,a=b.dataset.action;
if(a==='close')close();
else if(a==='page')navigate(v);
else if(a==='tab'){S.tab=v;S.reply=null;render()}
else if(a==='cq'){close();question(v)}
else if(a==='refresh')refreshAnalysis();
else if(a==='enterprise')enterprise();
else if(a==='changes')changes();
else if(a==='policy')policy();
else if(a==='risk')riskDetails(v);
else if(a==='risk-assistant'){const signal=M.riskSignals(S.contract).find(r=>r.code===v);close();S.tab='合同助手';if(signal)question(signal.question);else render()}
else if(a==='dimensions')dimensions();
else if(a==='contractsource')contractSource();
else if(a==='billlist'){const c=M.contract(S.contract);drawer('账单与收款核对 · '+c.id,billTable(c)+(c.unallocated?`<div class="note">已到账待分配：RC-A01-01，${M.money(c.unallocated)}，2026-11-07。当前未抵减账单余额。</div>`:''),`${btn('查看财务台账','gotobills','','primary small')}<span>账单状态取自生效核销数据</span>`)}
else if(a==='gotobills'){close();S.tab='财务收支台账';render();window.scrollTo({top:0,behavior:'smooth'})}
else if(a==='bill'){const bill=M.bills.find(x=>x.id===v);drawer('账单依据 · '+v,fields([['关联对象',bill.contract],['计费期',bill.period],['费用项',bill.fee],['应收',M.money(bill.ar)],['已核销',M.money(bill.paid)],['未核销',M.money(bill.balance)],['按期核销',M.money(bill.timely)],['到期日',bill.due],['逾期余额',M.money(bill.overdue)]]))}
else if(a==='renew')renew();
else if(a==='draft')draft();
else if(a==='task')draft('task');
else if(a==='savedraft'){const text=$('#draft-text')?.value||'';if(!text.trim()){notify('请填写草稿内容');return}S.drafts.push({contract:S.contract,type:S.draftType,text});close();render();notify('已保存本地草稿，业务数据未变更')}
else if(a==='draftlist'){drawer('本次演示草稿',S.drafts.filter(x=>x.contract===S.contract).map(x=>`<div class="scene-card"><h3>${x.type==='task'?'跟进待办':'催缴内容'}</h3><p style="white-space:pre-wrap">${e(x.text)}</p></div>`).join(''))}
else if(a==='new')newSession();
else if(a==='ask')ask(v);
else if(a==='stop')stop();
else if(a==='history'){stop(false);const ss=S.sessions.find(x=>x.id===v);if(ss){S.active=v;S.scope=ss.scope;render()}}
else if(a==='retry'){if(S.busy){notify('请先停止当前生成');return}const ss=activeSession(),old=ss?.messages[Number(v)];if(!old)return;const fork={...ss,id:'s'+Date.now(),time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:ss.messages.slice(0,Number(v)).map(m=>({...m}))};S.sessions.unshift(fork);S.active=fork.id;ask(old.q)}
else if(a==='sources')sources(v);
else if(a==='export')downloadCSV(v);
else if(a==='opencontract'){stop(false);S.contract=v;S.tab='合同助手';S.reply=null;S.returnAsk=true;navigate('contract')}
else if(a==='gotoask'){close();navigate('ask')}
else if(a==='scenes'){S.scene=v||S.page;showScenes(S.scene)}
else if(a==='scene-tab')showScenes(v);
else if(a==='scene-contract'){close();S.tab='合同助手';navigate('contract');question(v)}
else if(a==='scene-ask'){close();stop(false);S.active=null;if(v.includes('查看上次查询结果')){const q='哪些合同欠费需要催缴',answer=M.answer(q,S.scope),ss={id:'s'+Date.now(),title:q,scope:S.scope,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:[{q,a:answer,shown:answer.text,status:'done'}]};S.sessions.unshift(ss);S.active=ss.id;navigate('ask');ask('按项目分组')}else{navigate('ask');ask(v)}}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='ask-form'){ev.preventDefault();ask($('#question').value)}});
document.addEventListener('change',ev=>{if(ev.target.id==='contract-select'){S.contract=ev.target.value;S.reply=null;render()}if(ev.target.id==='scope-select'){stop(false);S.scope=ev.target.value;S.active=null;render();notify('已切换查询范围，新问题将按所选项目查询')}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#overlay').children.length)close();if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='question'&&!ev.isComposing){ev.preventDefault();ask(ev.target.value)}if(ev.key==='Tab'&&$('#overlay').children.length){const xs=[...$('#overlay').querySelectorAll('button,a,textarea,select,input')].filter(x=>!x.disabled);if(ev.shiftKey&&document.activeElement===xs[0]){ev.preventDefault();xs.at(-1)?.focus()}else if(!ev.shiftKey&&document.activeElement===xs.at(-1)){ev.preventDefault();xs[0]?.focus()}}});
window.addEventListener('hashchange',()=>{const page=location.hash.startsWith('#ask')?'ask':'contract';if(page!==S.page){stop(false);S.page=page;render()}});
seed();render();
})();
</script></body></html>
