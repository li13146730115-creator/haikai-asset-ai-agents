else if(/及时|历史|迟付/.test(q)){title='付款及时性';text=`到期应收 ${M.money(c.ar)}，按期核销 ${M.money(c.timely)}，按期回款完成率 ${M.pct(c.timely,c.ar)}%。已核销中有 ${M.money(c.latePaid)} 属于历史迟付，已结清部分不会重复计入当前欠费。当前逾期余额 ${M.money(c.overdue)}。`;action='billlist';}
else if(/催缴|催收|下一步|风险|处理|跟进/.test(q)){title='处理建议与催缴准备';text=c.overdue?`当前合同逾期未核销 ${M.money(c.overdue)}。${c.unallocated?'请优先核对 '+M.money(c.unallocated)+' 已到账待分配款项；':''}建议由 ${c.owner} 复核账单与收款，再生成催缴草稿并确认发送方式。${c.renew?'同时跟踪 '+c.end+' 到期前的续签准备。':''}实际收款和任务完成需回到原业务流程确认。`:'当前无逾期余额，无需针对当前账单生成逾期催缴。可继续关注后续付款节点与到期安排。';action=c.overdue?'draft':'contractsource';}
else if(/账单|交费|缴费|欠|应收|回款|付款|未交|没交/.test(q)){title='当前账单与未缴核查';text=`当前期间应收 ${M.money(c.ar)}，已核销 ${M.money(c.paid)}，未核销 ${M.money(c.balance)}，其中逾期 ${M.money(c.overdue)}。${c.bills.filter(b=>b.balance>0).map(b=>b.id+' 未核销 '+M.money(b.balance)+'，到期日 '+b.due+'。').join('')}${c.unallocated?'另有 '+M.money(c.unallocated)+' 到账待分配，暂不冲减账单余额。':''}`;action='billlist';}
else{title='请补充要核查的履约问题';text='可询问当前合同的账单未缴、催缴、到账差异、保证金、付款及时性或续签准备。此原型按预设业务场景演示，真实语言理解由企业中台承担。'}
return{title,text,action};}
function contractReply(c,q){const a=contractAnalysis(c,q),labels={billlist:'查看账单与收款',draft:'生成催缴草稿',renew:'查看续签清单',contractsource:'查看数据依据',gotoask:'进入智能问数'};return `<div class="contract-answer" id="contract-reply"><div class="answer-meta"><span class="ai-badge">AI</span>当前合同 ${c.id} · 模拟回答</div><h4>${e(a.title)}</h4><p>${e(a.text)}</p><div class="row">${btn(labels[a.action],a.action,'','link small')}${btn('生成跟进待办草稿','task','','link small')}</div></div>`}
function question(cq){S.reply=cq;render();$('#contract-reply')?.scrollIntoView({behavior:'smooth',block:'center'})}
function queryPage(){const active=S.sessions.find(x=>x.id===S.active);return `<div class="breadcrumb">经营驾驶舱 / 智能问数</div><div class="title-row"><div><h1>智能问数</h1><p>围绕资产、客商、合同与收款，直接提问，逐层查看经营结果。</p></div>${btn('新建会话','new','','primary small')}</div><div class="scope-strip"><span>查询范围</span><select class="select-control small" id="scope-select" aria-label="问数查询项目范围">${Object.entries(M.scopes).map(([k,v])=>`<option value="${k}" ${S.scope===k?'selected':''}>${e(v)}</option>`).join('')}</select><span class="small">数据截至 ${M.ASOF}<span class="wide-only"> · 当前期间 ${M.PERIOD}</span></span></div><div class="query-layout"><section class="conversation"><div class="conversation-top"><h3>${active?e(active.title):'开始一次经营分析'}</h3>${tag(S.busy?'正在生成…':'AI 问数')}</div><div class="chat-log" id="chat-log">${active?active.messages.map((m,i)=>message(m,i)).join(''):welcome()}</div><form class="composer" id="ask-form"><div class="input-frame"><textarea id="question" aria-label="智能问数问题" placeholder="例如：目前哪些合同欠费？按项目给我看一下。" ${S.busy?'disabled':''}></textarea><div class="input-bottom"><span>Enter 发送 · Shift + Enter 换行</span>${S.busy?btn('停止生成','stop','','small'):'<button class="primary" type="submit">发送</button>'}</div></div><p class="composer-note">结果附查询范围、口径和来源；历史会话保留查询时的快照。本原型使用合成数据模拟流式返回。</p></form></section><aside class="history-panel"><div class="row between"><h3>历史会话</h3><span class="small muted">${S.sessions.filter(x=>S.scope==='all'||x.scope===S.scope).length} 条</span></div><p>选择会话，回看当时的问题与结果</p><div class="history-label">本地演示记录</div>${S.sessions.filter(x=>S.scope==='all'||x.scope===S.scope).map(x=>`<button class="history-item ${x.id===S.active?'selected':''}" data-action="history" data-value="${e(x.id)}"><b>${e(x.title)}</b><small>${e(x.time)} · ${M.scopes[x.scope]} · ${x.messages.length}轮</small></button>`).join('')||'<div class="empty">当前范围暂无历史<br>发送问题后自动保留</div>'}<div class="history-footer">查询范围：资产、设备台账、客商、合同、账单核销、多经点位。<br><br>点选历史不重新查询；需要最新数据时可重新生成。</div></aside></div><div class="demo-bar"><span>左侧对话与结果 · 右侧历史会话</span>${btn('查看问数落地场景（10）','scenes','ask','link small')}</div>`}
function welcome(){const qs=[['当前整体经营概览','管理者 · 经营总览'],['哪些合同欠费需要催缴','一线 / 财务 · 欠费清单'],['资产出租率与空置情况','招商运营 · 资产分析'],['远景科技旗下合同回款情况','管理者 · 客商关联合同'],['90天内到期合同有哪些','招商 / 负责人 · 到期统筹'],['各项目登记了多少设备','运营 · 设备台账']];return `<div class="welcome"><p class="eyebrow">BUSINESS INSIGHTS</p><h2>把经营问题，交给数据回答</h2><p>从一个问题开始，查看指标、图表与明细。<br>可以继续追问，也可以进入合同助手核查单份合同。</p><div class="domain-pills">${['资产','客商','合同','账单与收款','设备台账','多经点位'].map(x=>`<span>${x}</span>`).join('')}</div><div class="suggestions">${qs.map(([q,t])=>`<button data-action="ask" data-value="${e(q)}">${e(q)} →<small>${e(t)}</small></button>`).join('')}</div></div>`}
function message(m,i){return `<article><div class="user-message"><div>${e(m.q)}</div></div><div class="answer-message"><div class="answer-meta"><span class="ai-badge">AI</span> 智能问数 <span class="muted">${M.scopes[m.a.scope]}</span></div><div class="answer-body" id="stream-${i}">${e(m.shown||'')}${m.status==='streaming'?'<span class="stream-line"></span>':''}</div>${m.status==='streaming'?'<p class="progress-text">已读取授权数据，正在组织结果…</p>':m.status==='stopped'?`<p class="progress-text">已停止生成，当前内容未完成。</p>${btn('重新生成','retry',i,'link small')}`:resultCard(m.a,i)}</div></article>`}
function resultCard(a,i){return `<div class="answer-result"><h3>${e(a.title)}</h3>${a.metrics.length?kpis(a.metrics):''}${a.chart.length?chart(a):''}${a.rows.length?table(a.columns,a.rows.map(r=>r.values.map((v,j)=>j===0&&r.id?btn(v,'opencontract',r.id,'link small'):e(v)))):''}<div class="answer-actions">${a.evidence.length?btn('查看数据来源与口径','sources',i,'link small'):'<span class="small muted">当前问题需要补充数据或范围</span>'}<div class="row">${btn('重新生成','retry',i,'link small')}${a.rows.length?btn('导出结果 CSV','export',i,'link small'):''}</div></div><p class="result-stamp">截至 ${a.asof} · ${e(M.scopes[a.scope])} · 查询快照</p></div><div class="followups">${a.followups.map(q=>btn(q,'ask',q,'small')).join('')}</div>`}
function chart(a){const max=Math.max(...a.chart.map(x=>x.value??0),1);return `<div class="bar-chart"><p class="bar-title">${e(a.chartTitle)}</p>${a.chart.map(x=>`<div class="bar-row"><span>${e(x.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,x.value??0)/max*100}%"></div></div><span class="bar-value">${x.value===null?'—':x.value.toLocaleString('zh-CN')}</span></div>`).join('')}</div>`}
function scrollChat(){const el=$('#chat-log');if(el)el.scrollTop=el.scrollHeight}
function activeSession(){return S.sessions.find(x=>x.id===S.active)}
function stop(show=true){if(S.timer){clearInterval(S.timer);S.timer=null}if(S.busy){const m=activeSession()?.messages.at(-1);if(m)m.status='stopped';S.busy=false;save();if(show)render()}}
function newSession(){stop(false);S.active=null;render();$('#question')?.focus()}
function ask(q){q=q.trim();if(!q||S.busy)return;let session=activeSession();if(!session){session={id:'s'+Date.now(),title:q.slice(0,60),scope:S.scope,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:[]};S.sessions.unshift(session);S.sessions=S.sessions.slice(0,30);S.active=session.id}const prev=session.messages.at(-1)?.a;const a=M.answer(q,session.scope,prev);const m={q,a,shown:'',status:'streaming'};session.messages.push(m);S.busy=true;if($('#question'))$('#question').value='';render();let n=0;S.timer=setInterval(()=>{n+=8;m.shown=a.text.slice(0,n);const el=$('#stream-'+(session.messages.length-1));if(el){el.textContent=m.shown;const c=document.createElement('span');c.className='stream-line';el.appendChild(c);scrollChat()}if(n>=a.text.length){clearInterval(S.timer);S.timer=null;m.status='done';S.busy=false;save();render()}},26)}
function drawer(title,body,foot=''){const prev=document.activeElement;S.previousFocus=prev;$('#overlay').innerHTML=`<div class="overlay-screen"><section class="drawer" role="dialog" aria-modal="true" aria-label="${e(title)}"><header class="drawer-head"><div><h2>${e(title)}</h2><p>海开资管 · 双智能体原型</p></div>${btn('关闭','close','','small')}</header><div class="drawer-body">${body}</div>${foot?`<footer class="drawer-foot">${foot}</footer>`:''}</section></div>`;$('#overlay [data-action="close"]').focus()}
function close(){const f=S.previousFocus;$('#overlay').innerHTML='';if(f?.isConnected)f.focus()}
function dimensions(){const c=M.contract(S.contract);drawer('履约雷达 · 维度口径',`<p class="helper">各维度独立展示完成率，不合成企业信用评分。未知或不适用的轴不连成完整多边形。</p>${M.radar(c.id).map(a=>`<div class="scene-card"><h3>${e(a.label)} ${tag(a.value===null?'—':a.value+'%')}</h3><p>${e(a.fact)}</p><p class="caption">${a.key==='timely'?'按核销分配对应的实际到账日期与账单到期日比较；已结清的迟付金额仍属于历史迟付。':a.key==='renew'?'当前样例清单：意向确认、方案审批、协议签署，各项等权；仅适用于90天准备窗口。':a.key==='follow'?'跟进完成表示催缴记录或处理回执完整，不表示账单已经回款。':'金额按相应账单/保证金记录计算，保留生效版本与原始记录ID。'}</p>${btn('询问这一维度','cq',a.question,'link small')}</div>`).join('')}`)}
function contractSource(){const c=M.contract(S.contract);drawer('当前合同 · 分析依据',fields([['合同范围',c.id],['签约客商',c.name],['期间',M.PERIOD],['截至时间',M.ASOF],['数据类型','合成演示数据'],['生效版本','V1']])+`<h3>账单依据</h3>${billTable(c)}<h3>其他依据</h3><div class="source-list"><div>合同期限：${c.id} / end_date = ${c.end}</div><div>保证金：${c.deposit?M.money(c.deposit[0])+' / '+M.money(c.deposit[1]):'来源缺失，无法判断'}</div><div>准备清单：${c.renew?c.renew.join(' / ')+' 项':'当前不适用'}</div>${c.unallocated?`<div>RC-A01-01：2026-11-07到账 ${M.money(c.unallocated)}，已关联合同但未核销。</div>`:''}</div><p class="caption">生产接口还需提供源记录更新时间、合同版本、核销分配ID与权限范围。本页不代表已连接真实系统。</p>`)}
function renew(){const c=M.contract(S.contract);const labels=['续签意向已确认','续签方案已审批','续签协议已签署'];drawer('续签准备 · '+c.id,`<div class="note">合同结束日 ${c.end}，剩余 ${c.days} 天。${c.renew?'已进入90天准备窗口。':'当前尚未进入准备窗口。'}</div>${table(['准备事项','当前状态','责任角色'],labels.map((t,i)=>[e(t),c.renew?(i<c.renew[0]?tag('已完成','green'):tag('待推进','amber')):tag('当前不适用'),['招商经办','部门负责人','签约经办'][i]]))}<h3>推进建议</h3><p>先确认续签意向，再结合欠费与保证金核验，推进方案审批和协议签署；不续签时进入退出、结算与资产回收流程。</p><p class="caption">这些状态是原型准备清单；生产需映射资管已有的续签及审批记录。</p>`,`${btn('生成跟进待办草稿','task','','primary')}<span>仅保存演示草稿，不修改合同期限</span>`)}
function draft(type='collection'){const c=M.contract(S.contract);if(type==='collection'&&!c.overdue){notify('当前合同无逾期未核销账单');return}S.draftType=type;
const text=type==='collection'?`${c.name}：\n关于合同 ${c.id}（${M.scopes[c.project]}，${c.room}），截至 ${M.ASOF}，租金账单逾期未核销合计 ${M.money(c.overdue)}。\n${c.bills.filter(b=>b.overdue>0).map(b=>`账单 ${b.id}；到期日 ${b.due}；未核销 ${M.money(b.balance)}`).join('\n')}\n${c.unallocated?'核账提示：另有 '+M.money(c.unallocated)+' 已到账待分配，请财务先完成核对并更新本草稿金额。\n':''}请协助核对付款情况；如已付款，请提供付款凭证，以便财务核销。\n联系人：${c.owner}（演示负责人）\n【草稿待复核，未发送】`:`待办主题：${c.id} 履约事项跟进\n负责人：${c.owner}\n1. 核对账单未核销 ${M.money(c.balance)}${c.unallocated?'及已到账待分配 '+M.money(c.unallocated):''}。\n2. 检查保证金资料与当前有效余额。\n3. ${c.renew?'推进续签准备清单，当前完成 '+c.renew.join('/')+' 项。':'跟踪后续履约与到期节点。'}\n完成后需复核源数据并重新分析，任务完成不代表欠费结清。\n【本地演示待办草稿】`;
drawer(type==='collection'?'催缴内容草稿 · 待核账':'跟进待办草稿',`<p class="helper">基于 ${c.id} 的当前事实生成，可编辑后保存到本地草稿。实际发送和派单由原业务流程承接。</p>${c.unallocated?'<div class="note">发现已到账待分配款项，需先核账再确认催缴金额。</div>':''}<textarea id="draft-text" aria-label="草稿内容">${e(text)}</textarea>`,`${btn('保存本地草稿','savedraft','','primary')}<span>未发送、未派单、未变更财务数据</span>`)}
function showScenes(tab){if(tab)S.scene=tab;const tabs=`<div class="scene-tabs">${btn('合同助手 · 8个场景','scene-tab','contract',S.scene==='contract'?'primary':'')}${btn('智能问数 · 10个场景','scene-tab','ask',S.scene==='ask'?'primary':'')}${btn('页面与接入流程','scene-tab','flow',S.scene==='flow'?'primary':'')}</div>`;
const content=S.scene==='flow'?flow():M.SCENES.filter(x=>x.agent===S.scene).map(x=>`<article class="scene-card"><h3>${e(x.id+' '+x.title)} ${tag(x.role)}</h3><dl>${[['角色问法',x.question],['所需数据',x.data],['处理与展示',x.flow],['验收样例',x.accept],['边界',x.boundary]].map(([a,b])=>`<dt>${e(a)}</dt><dd>${e(b)}</dd>`).join('')}</dl>${btn('演示这个问题',x.agent==='contract'?'scene-contract':'scene-ask',x.question,'link small mini-space')}</article>`).join('');
drawer('核心场景与落地流程',tabs+content,`<a href="核心落地方案.html" target="_blank" rel="noopener">打开完整核心落地方案</a><a href="核心原型资料包_V3.0.zip" download>下载原型与方案</a>`)}
function flow(){return `<h3>合同助手：在合同详情完成单份合同核查</h3><div class="flow-list"><div>01 · 合同台账 → 合同详情 → 合同助手 Tab<small>携带当前合同ID；进入即展示当前数据范围。</small></div><div>02 · 资管取数、校验并计算<small>当前合同 + 应收账单 + 核销分配 + 保证金 + 结束日期 + 续签/催缴记录。</small></div><div>03 · 企业中台分析并返回<small>资管后端通过 BaseURL + API 调用合同助手，返回结论、维度指标、建议和证据。</small></div><div>04 · 资管展示 → 核对明细 → 人工处理 → 重新分析<small>雷达、账单、准备清单和草稿；正式收款、发出催缴、派单、续签均由已有业务流程处理。</small></div></div><h3>智能问数：驾驶舱下的连续对话</h3><div class="flow-list"><div>01 · 驾驶舱 → 智能问数 → 选择范围并提问<small>覆盖用户有权访问的资产、客商、合同、账单等业务数据。</small></div><div>02 · 企业中台识别问题 → 资管数据接口执行查询<small>指标目录约束维度与口径；业务接口计算汇总，模型生成解释。</small></div><div>03 · 结果流式返回 → 左侧展示<small>状态、文字增量、指标、图表、表格、证据依次呈现；可停止和重新生成。</small></div><div>04 · 继续追问 / 合同下钻 / 右侧历史回看<small>按会话保留上下文与结果快照。历史不自动刷新，重新查询生成新快照。</small></div></div><h3>双方系统怎么连接</h3><p>资管页面 → 资管后端 → 企业AI中台（BaseURL + API）→ 资管后端校验结果 → 页面展示。中台通过双方约定的受控业务API查询授权数据；合同助手优先由资管后端提供单合同事实快照。</p><div class="note">BaseURL、鉴权密钥、智能体应用ID和接口路径在服务端配置。中台真实协议尚需双方联调确认，详细方案提供的是拟定适配协议。</div><p class="helper">当前页面为可操作的前端原型：预设场景识别、合成数据、本地草稿和历史、模拟流式展示。真实中台与业务API尚未接入。</p>`}
function sources(i){const a=activeSession()?.messages[Number(i)]?.a;if(!a)return;drawer('数据来源与指标口径',fields([['查询范围',M.scopes[a.scope]],['截至时间',a.asof],['当前期间',a.period],['统计方式','授权过滤后聚合'],['数据性质','合成样例'],['结果类型',a.kind]])+`<h3>计算口径</h3><p>租金应收为当前期间生效租金账单；已核销为对应账单的有效分配金额；逾期为到期日早于截至日且仍未核销的余额。保证金与多经点位账单独立统计。面积出租率为去重资产快照的已租面积 / 可租面积。</p><h3>本次依据</h3><div class="source-list">${a.evidence.map(x=>`<div>${e(x)}</div>`).join('')}</div><p class="caption">快照回看保留原查询结果；生产环境查看历史时仍须重新校验权限。详细数据覆盖与更新时间需由真实接口提供。</p>`)}
function downloadCSV(i){const a=activeSession()?.messages[Number(i)]?.a;if(!a?.rows.length)return;const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';const data='\uFEFF'+[a.columns,...a.rows.map(r=>r.values)].map(r=>r.map(quote).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='问数结果_'+a.kind+'_'+a.asof+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function navigate(page){stop(false);S.page=page;location.hash=page;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const v=b.dataset.value,a=b.dataset.action;
if(a==='close')close();
else if(a==='page')navigate(v);
else if(a==='tab'){S.tab=v;S.reply=null;render()}
else if(a==='cq'){close();question(v)}
else if(a==='refresh'){S.reply=null;render();notify('已按当前演示快照重新分析，源数据截至 '+M.ASOF)}
else if(a==='dimensions')dimensions();
else if(a==='contractsource')contractSource();
else if(a==='billlist'){const c=M.contract(S.contract);drawer('账单与收款核对 · '+c.id,billTable(c)+(c.unallocated?`<div class="note">已到账待分配：RC-A01-01，${M.money(c.unallocated)}，2026-11-07。当前未抵减账单余额。</div>`:''),`${btn('查看财务台账','gotobills','','primary small')}<span>账单状态取自生效核销数据</span>`)}
else if(a==='gotobills'){close();S.tab='财务收支台账';render();window.scrollTo({top:0,behavior:'smooth'})}
else if(a==='bill'){const bill=M.bills.find(x=>x.id===v);drawer('账单依据 · '+v,fields([['关联对象',bill.contract],['计费期',bill.period],['费用项',bill.fee],['应收',M.money(bill.ar)],['已核销',M.money(bill.paid)],['未核销',M.money(bill.balance)],['按期核销',M.money(bill.timely)],['到期日',bill.due],['逾期余额',M.money(bill.overdue)]]))}
else if(a==='renew')renew();
else if(a==='draft')draft();
else if(a==='task')draft('task');
else if(a==='savedraft'){const text=$('#draft-text')?.value||'';if(!text.trim()){notify('请填写草稿内容');return}S.drafts.push({contract:S.contract,type:S.draftType,text});close();render();notify('已保存本地草稿，业务数据未变更')}
else if(a==='draftlist'){drawer('本次演示草稿',S.drafts.filter(x=>x.contract===S.contract).map(x=>`<div class="scene-card"><h3>${x.type==='task'?'跟进待办':'催缴内容'}</h3><p style="white-space:pre-wrap">${e(x.text)}</p></div>`).join(''))}
else if(a==='new')newSession();
else if(a==='ask')ask(v);
else if(a==='stop')stop();
else if(a==='history'){stop(false);const ss=S.sessions.find(x=>x.id===v);if(ss){S.active=v;S.scope=ss.scope;render()}}
else if(a==='retry'){if(S.busy){notify('请先停止当前生成');return}const ss=activeSession(),old=ss?.messages[Number(v)];if(!old)return;const fork={...ss,id:'s'+Date.now(),time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:ss.messages.slice(0,Number(v)).map(m=>({...m}))};S.sessions.unshift(fork);S.active=fork.id;ask(old.q)}
else if(a==='sources')sources(v);
else if(a==='export')downloadCSV(v);
else if(a==='opencontract'){stop(false);S.contract=v;S.tab='合同助手';S.reply=null;S.returnAsk=true;navigate('contract')}
else if(a==='gotoask'){close();navigate('ask')}
else if(a==='scenes'){S.scene=v||S.page;showScenes(S.scene)}
else if(a==='scene-tab')showScenes(v);
else if(a==='scene-contract'){close();S.tab='合同助手';navigate('contract');question(v)}
else if(a==='scene-ask'){close();stop(false);S.active=null;if(v.includes('查看上次查询结果')){const q='哪些合同欠费需要催缴',answer=M.answer(q,S.scope),ss={id:'s'+Date.now(),title:q,scope:S.scope,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),messages:[{q,a:answer,shown:answer.text,status:'done'}]};S.sessions.unshift(ss);S.active=ss.id;navigate('ask');ask('按项目分组')}else{navigate('ask');ask(v)}}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='ask-form'){ev.preventDefault();ask($('#question').value)}if(ev.target.id==='contract-form'){ev.preventDefault();const q=$('#contract-question').value.trim();if(q)question(q)}});
document.addEventListener('change',ev=>{if(ev.target.id==='contract-select'){S.contract=ev.target.value;S.reply=null;render()}if(ev.target.id==='scope-select'){stop(false);S.scope=ev.target.value;S.active=null;render();notify('已切换查询范围，新问题将按所选项目查询')}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#overlay').children.length)close();if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='question'&&!ev.isComposing){ev.preventDefault();ask(ev.target.value)}if(ev.key==='Tab'&&$('#overlay').children.length){const xs=[...$('#overlay').querySelectorAll('button,a,textarea,select,input')].filter(x=>!x.disabled);if(ev.shiftKey&&document.activeElement===xs[0]){ev.preventDefault();xs.at(-1)?.focus()}else if(!ev.shiftKey&&document.activeElement===xs.at(-1)){ev.preventDefault();xs[0]?.focus()}}});
window.addEventListener('hashchange',()=>{const page=location.hash.startsWith('#ask')?'ask':'contract';if(page!==S.page){stop(false);S.page=page;render()}});
seed();render();
})();
</script></body></html>
